# GPU variant of environment.yml (CUDA build of PyTorch)
channels:
  - conda-forge
dependencies:
  - conda-forge::python=3.13
  - conda-forge::cellpose=4.1.1
  - conda-forge::ome-zarr=0.21.0
  - conda-forge::zarr=3.4.2
  - conda-forge::scikit-image=0.26.0
  - conda-forge::pytorch=2.13.0=cuda130*
  - conda-forge::cuda-version=13.0
